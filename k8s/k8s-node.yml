apiVersion: apps/v1
kind: Deployment # Resource sử dụng
metadata:
  name: node-deploy # Tên resource khởi tạo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: node-js
  template:
    metadata:
      labels:
        app: node-js
    spec:
      containers:
      - name: node-js
        image: undertarke/k8s-node-down:latest
        ports:
        - containerPort: 8088
        resources:
          requests:
            cpu: 50m # yêu cầu tối thiểu 0.05 core
          limits:
            cpu: 100m

---


apiVersion: v1
kind: Service
metadata:
  name: node-service
spec:
  type: NodePort
  selector:
    app:  node-js 
  ports:
  - port: 8088
    nodePort: 30088 #rank 30000-32767

