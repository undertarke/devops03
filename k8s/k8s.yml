apiVersion: apps/v1
kind: Deployment # Resource sử dụng
metadata:
  name: html-web-deploy # Tên resource khởi tạo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: html-web 
  template:
    metadata:
      labels:
        app: html-web
    spec:
      containers:
      - name: html-web
        image: undertarke/k8s:latest
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: 50m # yêu cầu tối thiểu 0.05 core
          limits:
            cpu: 100m



---

apiVersion: v1
kind: Service
metadata:
  name: html-web-service
spec:
  type: NodePort
  selector:
    app:  html-web 
  ports:
  - port: 80
    nodePort: 30008 #rank 30000-32767


    